name: Notify Bridge on Push

# Fires a repository_dispatch event to rh-p5-bridge-14 whenever a commit
# lands on main.  The bridge's relock-chain.yml listens for the
# "ensemble-push" event type and immediately reruns the chain re-lock,
# so drift is caught within minutes rather than waiting until Monday.
#
# Requires GH_PUSH_TOKEN — a fine-grained PAT with
#   Contents: read  and  Actions: write  on rh-p5-bridge-14.

on:
  push:
    branches:
      - main

jobs:
  notify-bridge:
    name: "Dispatch ensemble-push to rh-p5-bridge-14"
    runs-on: ubuntu-latest

    steps:
      - name: Fire repository_dispatch to bridge
        env:
          GH_TOKEN: ${{ secrets.GH_PUSH_TOKEN }}
        run: |
          if [ -z "$GH_TOKEN" ]; then
            echo "GH_PUSH_TOKEN not configured — skipping bridge dispatch"
            exit 0
          fi
          curl -sf -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/DavidFox998/rh-p5-bridge-14/dispatches \
            -d '{
              "event_type": "ensemble-push",
              "client_payload": {
                "source_repo": "'"$GITHUB_REPOSITORY"'",
                "sha":         "'"$GITHUB_SHA"'"
              }
            }'
          echo "Dispatched ensemble-push from $GITHUB_REPOSITORY @ $GITHUB_SHA"
