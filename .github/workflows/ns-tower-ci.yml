name: NS-Tower CI
on:
  push:
    branches: [main, claude-bogovskii-div-cz]
  pull_request:
    branches: [main]

concurrency:
  group: ns-tower-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Restore Lake packages
        id: lake-cache
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lake-v3-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-v3-

      - name: Build Wall266 proofs
        run: |
          lake build Towers.NS.Wall266_Bogovskii Towers.NS.Wall266_H4L4 Towers.NS.Wall266_TrilinearForm Towers.NS.Wall266_L2Extension

      - name: Save Lake packages
        if: always() && steps.lake-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ steps.lake-cache.outputs.cache-primary-key }}
