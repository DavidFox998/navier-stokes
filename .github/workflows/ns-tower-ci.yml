name: NS-Tower CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ns-tower-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Lake build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install elan
        run: |
          curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y
          echo "$HOME/.elan/bin" >> $GITHUB_PATH

      - name: Cache Lake packages
        if: always()
        uses: actions/cache@v4
        with:
          path: |
            ~/.elan
            .lake
          key: ${{ runner.os }}-lake-v2-${{ hashFiles('lake-manifest.json') }}
          restore-keys: |
            ${{ runner.os }}-lake-v2-

      - name: Build Wall266 proofs
        run: |
          lake build Towers.NS.Wall266_H4L4 Towers.NS.Wall266_TrilinearForm Towers.NS.Wall266_L2Extension
