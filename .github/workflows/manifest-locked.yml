name: MANIFEST LOCKED
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  check:
    name: Verify manifest is locked
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Check lake-manifest.json is committed
        run: |
          if [ ! -f lake-manifest.json ]; then
            echo "ERROR: lake-manifest.json is not committed"
            exit 1
          fi
          LINES=$(wc -l < lake-manifest.json)
          echo "OK: lake-manifest.json committed ($LINES lines)"
          echo "SHA256: $(sha256sum lake-manifest.json | cut -c1-16)..."

      - name: Check no sorry in Towers/ (comment-stripped)
        run: |
          python3 - <<'PYEOF'
          import re, sys, os

          sorry_files = []
          for root, dirs, files in os.walk('Towers'):
              dirs[:] = [d for d in dirs if not d.startswith('.')]
              for fname in files:
                  if not fname.endswith('.lean'):
                      continue
                  path = os.path.join(root, fname)
                  with open(path) as f:
                      content = f.read()
                  stripped = re.sub(r'/-.*?-/', '', content, flags=re.DOTALL)
                  stripped = re.sub(r'--.*', '', stripped)
                  if re.search(r'\bsorry\b', stripped):
                      sorry_files.append(path)

          if sorry_files:
              for f in sorry_files:
                  print(f"ERROR: sorry in {f}")
              sys.exit(1)
          else:
              print(f"OK: 0 sorry (comment-stripped) in Towers/")
          PYEOF
